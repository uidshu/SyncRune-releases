name: Ошибка
description: Сообщить о проблеме в установке или работе SyncRune.
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: Сообщение будет публичным. Используйте вымышленные данные при описании проблемы.
  - type: input
    id: version
    attributes:
      label: Версия SyncRune
      placeholder: 1.0 Beta
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Версия Windows
      options:
        - Windows 10 22H2, x64
        - Windows 11, x64
        - Другая или не знаю
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло?
      description: Опишите проблему и текст ошибки, если он есть.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как повторить?
      placeholder: |
        1. Открыл(а)...
        2. Нажал(а)...
        3. Получил(а)...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Какой результат ожидался?
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка данных
      options:
        - label: В описании и приложенных файлах нет личных финансовых данных, выписок, чеков, документов, ключей и кода восстановления.
          required: true
